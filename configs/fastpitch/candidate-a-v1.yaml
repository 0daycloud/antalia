# Candidate A clean-init FastPitch diagnostic. Mel targets match the pinned BigVGAN-v2 24 kHz contract.
name: FastPitch
seed: 20260731
max_epochs: 300
batch_size: 64
n_speakers: 1
train_ds_meta: null
val_ds_meta: null
log_ds_meta: null
log_dir: null
sample_rate: 24000
win_length: 1024
hop_length: 256

mel_feature:
  _target_: nemo.collections.tts.parts.preprocessing.features.MelSpectrogramFeaturizer
  sample_rate: ${sample_rate}
  win_length: ${win_length}
  hop_length: ${hop_length}
  mel_dim: 100
  lowfreq: 0
  highfreq: 12000

pitch_feature:
  _target_: turkish_tts.nemo_features.WorldPitchFeaturizer
  sample_rate: ${sample_rate}
  win_length: ${win_length}
  hop_length: ${hop_length}
  pitch_fmin: 50
  pitch_fmax: 500

energy_feature:
  _target_: nemo.collections.tts.parts.preprocessing.features.EnergyFeaturizer
  spec_featurizer: ${mel_feature}

featurizers:
  pitch: ${pitch_feature}
  energy: ${energy_feature}

model:
  learn_alignment: true
  bin_loss_warmup_epochs: 50
  n_speakers: ${n_speakers}
  n_mel_channels: ${mel_feature.mel_dim}
  min_token_duration: 1
  max_token_duration: 140
  symbols_embedding_dim: 384
  pitch_embedding_kernel_size: 3
  energy_embedding_kernel_size: 3
  speaker_emb_condition_prosody: false
  speaker_emb_condition_aligner: false
  use_log_energy: false
  dur_loss_scale: 0.1
  pitch_loss_scale: 0.01
  energy_loss_scale: 0.1
  aligner_loss_scale: 0.1

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    features: ${mel_feature.mel_dim}
    lowfreq: ${mel_feature.lowfreq}
    highfreq: ${mel_feature.highfreq}
    n_fft: ${win_length}
    n_window_size: ${win_length}
    window_size: false
    n_window_stride: ${hop_length}
    window_stride: false
    pad_to: 1
    pad_value: 0
    sample_rate: ${sample_rate}
    window: hann
    normalize: null
    preemph: null
    dither: 0.0
    frame_splicing: 1
    log: true
    log_zero_guard_type: clamp
    log_zero_guard_value: 0.00001
    mag_power: 1.0
    mel_norm: slaney

  text_tokenizer:
    _target_: turkish_tts.nemo_tokenizer.TurkishCharsTokenizer
    punct: true
    apostrophe: true
    pad_with_space: true

  train_ds:
    dataset:
      _target_: nemo.collections.tts.data.text_to_speech_dataset.TextToSpeechDataset
      dataset_meta: ${train_ds_meta}
      sample_rate: ${sample_rate}
      speaker_path: null
      align_prior_hop_length: ${hop_length}
      featurizers: ${featurizers}
      feature_processors: null
      min_duration: 0.35
      max_duration: 15.25
    dataloader_params:
      batch_size: ${batch_size}
      num_workers: 8
      pin_memory: true
      persistent_workers: true
      shuffle: true

  validation_ds:
    dataset:
      _target_: nemo.collections.tts.data.text_to_speech_dataset.TextToSpeechDataset
      dataset_meta: ${val_ds_meta}
      sample_rate: ${sample_rate}
      speaker_path: null
      align_prior_hop_length: ${hop_length}
      featurizers: ${featurizers}
      feature_processors: null
    dataloader_params:
      batch_size: ${batch_size}
      num_workers: 4
      pin_memory: true
      persistent_workers: true
      shuffle: false

  input_fft:
    _target_: nemo.collections.tts.modules.transformer.FFTransformerEncoder
    n_layer: 6
    n_head: 2
    d_model: ${model.symbols_embedding_dim}
    d_head: 64
    d_inner: 1536
    kernel_size: 3
    dropout: 0.1
    dropatt: 0.1
    dropemb: 0.0
    d_embed: ${model.symbols_embedding_dim}

  output_fft:
    _target_: nemo.collections.tts.modules.transformer.FFTransformerDecoder
    n_layer: 6
    n_head: 1
    d_model: ${model.symbols_embedding_dim}
    d_head: 64
    d_inner: 1536
    kernel_size: 3
    dropout: 0.1
    dropatt: 0.1
    dropemb: 0.0

  alignment_module:
    _target_: nemo.collections.tts.modules.aligner.AlignmentEncoder
    n_mel_channels: ${model.n_mel_channels}
    n_text_channels: ${model.symbols_embedding_dim}
    dist_type: cosine
    temperature: 15.0

  duration_predictor:
    _target_: nemo.collections.tts.modules.fastpitch.TemporalPredictor
    input_size: ${model.symbols_embedding_dim}
    kernel_size: 3
    filter_size: 256
    dropout: 0.1
    n_layers: 2

  pitch_predictor:
    _target_: nemo.collections.tts.modules.fastpitch.TemporalPredictor
    input_size: ${model.symbols_embedding_dim}
    kernel_size: 3
    filter_size: 256
    dropout: 0.1
    n_layers: 2

  energy_predictor:
    _target_: nemo.collections.tts.modules.fastpitch.TemporalPredictor
    input_size: ${model.symbols_embedding_dim}
    kernel_size: 3
    filter_size: 256
    dropout: 0.1
    n_layers: 2

  optim:
    name: adamw
    lr: 0.001
    betas: [0.9, 0.999]
    weight_decay: 0.000001
    sched:
      name: NoamAnnealing
      warmup_steps: 1000
      last_epoch: -1
      d_model: 1

trainer:
  num_nodes: 1
  devices: 8
  accelerator: gpu
  strategy: ddp
  precision: bf16-mixed
  max_epochs: ${max_epochs}
  max_steps: -1
  accumulate_grad_batches: 1
  gradient_clip_val: 10.0
  enable_checkpointing: false
  logger: false
  log_every_n_steps: 10
  check_val_every_n_epoch: 10
  deterministic: warn
  benchmark: true

exp_manager:
  exp_dir: null
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "{epoch}-{val_loss:.4f}"
  resume_if_exists: true
  resume_ignore_no_checkpoint: true
