name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@f1ecbd988b4e2c0e9d2dc1e4e4f96e303ba50dec # v6.10.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/turkish_tts
      - name: Test
        run: uv run pytest -q
